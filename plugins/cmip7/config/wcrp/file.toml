# ==============================================================================
# == File checks
# ==============================================================================

[file.format]
# Check FILE002
severity = "H"
expected_format = "HDF5"
allowed_data_models = ["NETCDF4_CLASSIC", "NETCDF4"]

# If you want to use the compression check for your netcdf files, uncomment this section to enable it.
#[file.compression]
# Check FILE003
#severity = "H"
#expected_complevel = 1
#expected_shuffle = true

[file.internal_packing.metadata]
# Check FILE004a - consolidated metadata
severity = "H"

[file.internal_packing.time]
# Check FILE004b-c - time and time bounds chunking
severity = "H"

[file.internal_packing.data]
# Check FILE004d - data variable chunking
severity = "H"

# Optional minimum uncompressed chunk size threshold (bytes). Default: 4 MiB.
#min_chunk_size_bytes = 4194304

# Optional fallback exceptions by frequency (applied only if file has time dependency).
#frequency_min_timesteps = { "dec" = 1, "yr" = 1, "mon" = 6, "day" = 1, "6hr" = 4, "3hr" = 1, "1hr" = 6 }