# Reduce CMIP7 grid metadata to the three coordinate layouts checked here.
#
# Explicit grid-label entries override the general ESGVoc metadata rules below.
# Unlisted and newly registered labels use grid_type plus optional grid_mapping.
# Combination keys use "type|mapping" and override the coarser type mapping.

[coordinate_identification]
# The ESGVoc out_name is always tried first. If enabled, an exact standard_name
# match may identify a differently named horizontal coordinate as a fallback.
allow_standard_name_fallback = true

[grid_label_recommendation]
reduced_horizontal_labels = ["hm", "hy", "hyb", "hys"]

[grid_label_recommendation.horizontal_label]
hs = "g013"
ht = "g014"

[grid_label_recommendation.horizontal_label_and_region]
"hm|glb" = "g010"
"hm|nh" = "g011"
"hm|sh" = "g012"

[grid_type]
regular_latitude_longitude = "rectilinear"
regular_gaussian = "rectilinear"
linear_spectral_gaussian = "rectilinear"
quadratic_spectral_gaussian = "rectilinear"
spectral_gaussian = "rectilinear"

displaced_pole = "curvilinear"
plane_projection = "curvilinear"
rotated_pole = "curvilinear"
tripolar = "curvilinear"

cubed_sphere = "unstructured"
cubic_octahedral_spectral_reduced_gaussian = "unstructured"
hierarchical_discrete_global_grid = "unstructured"
icosahedral_geodesic = "unstructured"
icosahedral_geodesic_dual = "unstructured"
reduced_gaussian = "unstructured"
spectral_reduced_gaussian = "unstructured"
unstructured_polygonal = "unstructured"
unstructured_quadrilateral = "unstructured"
unstructured_triangular = "unstructured"
yin_yang = "unstructured"

[grid_mapping]
albers_conical_equal_area = "curvilinear"
azimuthal_equidistant = "curvilinear"
geostationary = "curvilinear"
lambert_azimuthal_equal_area = "curvilinear"
lambert_conformal_conic = "curvilinear"
lambert_cylindrical_equal_area = "curvilinear"
orthographic = "curvilinear"
polar_stereographic = "curvilinear"
rotated_latitude_longitude = "curvilinear"
sinusoidal = "curvilinear"
stereographic = "curvilinear"
transverse_mercator = "curvilinear"
vertical_perspective = "curvilinear"
healpix = "unstructured"

[grid_type_and_mapping]
# All stretched grids registered so far use latitude_longitude and are treated
# as rectilinear. A future stretched grid could instead be unstructured; this
# first guess will then produce HIGH structural topology findings until an
# explicit grid_label override is added.
"stretched|latitude_longitude" = "rectilinear"

# Explicitly registered labels have highest precedence. An individual label
# may also be entered under [grid_label] to override these groups.
[grid_label]
# g229 is currently registered with grid_type=regular_latitude_longitude and
# grid_mapping=polar_stereographic. That combination is under discussion in
# the EMD repository; retain the expected curvilinear interpretation here
# until this discussion is resolved.
g229 = "curvilinear"

