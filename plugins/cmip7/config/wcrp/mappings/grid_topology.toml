# Reduce CMIP7 grid metadata to the three coordinate layouts checked here.
#
# Once ESGVoc exposes a branded variable's EMD grid relationship, add the
# authoritative identifiers to [grid_type] and, only where grid_type alone is
# ambiguous, to [grid_type_and_mapping].  Combination keys use "type|mapping".
# These metadata mappings take precedence over the temporary grid-label bridge.

[coordinate_identification]
# The ESGVoc out_name is always tried first. If enabled, an exact standard_name
# match may identify a differently named horizontal coordinate as a fallback.
allow_standard_name_fallback = true

[grid_type]

[grid_type_and_mapping]

# Temporary bridge based on the globally registered CMIP7 grid_label.  An
# individual label may also be overridden explicitly under [grid_label].
[grid_label]

