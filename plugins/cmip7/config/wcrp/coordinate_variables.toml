# ==============================================================================
# == ESGVoc-backed CMIP7 coordinate checks
# ==============================================================================

# Each registry subsection controls one reusable result family. Omitting a
# subsection disables that family.
[coordinates.registry.setup]
severity = "H"

[coordinates.registry.identity]
severity = "H"

[coordinates.registry.dimension_order]
severity = "H"

[coordinates.registry.attributes]
severity = "H"
# A model may supply this CF attribute even while its coordinate-catalogue
# field is empty. Other checked attributes with empty definitions must be absent.
allowed_when_unset = ["computed_standard_name"]
allowed_when_unset_severity = "L"

[coordinates.registry.recommendations]
severity = "M"

[coordinates.registry.direction]
severity = "H"
# These physical checks can be disabled independently while retaining the
# ordinary coordinate monotonicity and stored_direction checks in COORD005.
check_direct_physical_values = true
check_formula_derived_profile = true

[coordinates.registry.valid_range]
severity = "H"

[coordinates.registry.missing_value_attributes]
# Severity for values differing from expected_values_by_data_type and, when
# required_for_auxiliary is true, for missing attributes.
severity = "M"
# Severity for NaN attributes or disagreement between _FillValue and
# missing_value.
integrity_severity = "H"
# Severity when scalar or character coordinates define either attribute.
prohibited_severity = "H"
# If true, numeric auxiliary coordinates must define both attributes; if false,
# the attributes are optional but checked when supplied.
required_for_auxiliary = false
# Expected finite value for each supported netCDF storage type.
expected_values_by_data_type = { real = 1.0e20, double = 1.0e20 }

# Missing-value checks are independent of valid-range checks. A horizontal
# position may be fully void. Otherwise latitude/longitude centres and their
# vertices must form complete paired geometry. Jointly missing unstructured
# vertex padding is allowed when at least three finite vertex pairs remain.
# Repeated finite vertices remain permitted.
[coordinates.registry.grid_geometry_missing_values]
severity = "H"

# Auxiliary grid coordinates and their vertices
# CMIP7 recommends, but does not require, the auxiliary longitude range and
# its confinement to a single cycle.
[coordinates.registry.grid_latitude_valid_range]
severity = "M"

[coordinates.registry.grid_longitude_valid_range]
severity = "M"

[coordinates.registry.grid_longitude_single_cycle]
severity = "M"

# EMD driven checks
[coordinates.registry.grid_mapping_consistency]
severity = "M"

[coordinates.registry.grid_region_consistency]
severity = "M"

[coordinates.registry.grid_label_recommendation]
severity = "M"

[coordinates.registry.grid_cell_count_availability]
severity = "L"

[coordinates.registry.grid_cell_count_consistency]
severity = "M"

# Further coordinate CV driven checks
[coordinates.registry.requested_values]
severity = "H"

[coordinates.registry.bounds]
severity = "H"

[coordinates.registry.bounds_name]
severity = "M"
# Recommended bounds-related names; structure, existence, and dimension sizes
# remain HIGH checks under coordinates.registry.bounds/grid.
bounds_dimension_name = "bnds"
vertices_dimension_name = "vertices"
climatology_bounds_name = "climatology_bnds"

[coordinates.registry.associations]
severity = "H"

[coordinates.registry.grid]
severity = "H"

[coordinates.registry.formula]
severity = "H"

# ==============================================================================
# == Established time checks not replaced by the coordinate catalogue
# ==============================================================================

[coordinates.time.name]
variable_name = "time"

[coordinates.time.monotonicity]
# VAR005
severity = "H"
direction = "increasing"

[coordinates.time.attributes.calendar]
# ATTR004 allowed-value validation. Presence is owned by COORD003.
severity = "H"
enum = [
    "standard",
    "proleptic_gregorian",
    "noleap",
    "365_day",
    "all_leap",
    "julian",
    "366_day",
    "360_day",
    "utc",
    "tai",
]

[coordinates.time.squareness]
# TIME001
severity = "H"
ref_calendar = ""
ref_time_units = ""
ref_increment = ""

[coordinates.time.coverage]
# TIME002; the coordinate itself is selected dynamically from ESGVoc axis="T".
severity = "H"

[coordinates.time.calendar_recommendation]
# TIME003a
severity = "M"
