# ==============================================================================
# == Data Reference Syntax checks
# ==============================================================================

[drs.filename]
# Check FILE001
severity = "H"

[drs.directory]
# Check PATH003
severity = "H"

[drs.attributes_vs_directory]
# Checks PATH001
severity = "H"

[drs.filename_vs_directory]
# Check PATH002 
severity = "H"

[drs.time_range]
# CMIP7 climatology time ranges use the ordinary start-end form.
severity = "H"
climatology_suffix = ""

[drs.time_range.label_precision]
# Configurable precision used by TIME003 to validate filename time ranges.
climatology = "yyyyMM"
cen = "yyyy"
dec = "yyyy"
yr = "yyyy"
yrPt = "yyyy"
sem = "yyyyMM"
mon = "yyyyMM"
monC = "yyyyMM"
monClim = "yyyyMM"
monPt = "yyyyMM"
day = "yyyyMMdd"
6hr = "yyyyMMddhhmm"
6hrPt = "yyyyMMddhhmm"
3hr = "yyyyMMddhhmm"
3hrPt = "yyyyMMddhhmm"
1hr = "yyyyMMddhhmm"
1hrCM = "yyyyMMddhhmm"
1hrPt = "yyyyMMddhhmm"
subhr = "yyyyMMddhhmmss"
subhrPt = "yyyyMMddhhmmss"
