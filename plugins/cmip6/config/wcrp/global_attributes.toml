# Global attribute policy
# ESGVoc ncattvalid is authoritative for attributes it specifies.
# Those entries contain severity only. Full rules below are local
# complements for attributes not defined by ncattvalid.

[global.attributes.activity_id]
severity = "H"

[global.attributes.branch_method]
severity = "M"

[global.attributes.branch_time_in_child]
severity = "H"

[global.attributes.branch_time_in_parent]
severity = "H"

[global.attributes.Conventions]
severity = "H"

[global.attributes.creation_date]
severity = "L"

[global.attributes.data_specs_version]
severity = "H"

[global.attributes.experiment]
severity = "M"

[global.attributes.experiment_id]
severity = "H"

[global.attributes.forcing_index]
severity = "H"

[global.attributes.frequency]
severity = "H"

[global.attributes.further_info_url]
severity = "H"

[global.attributes.grid_label]
severity = "H"

[global.attributes.grid]
severity = "M"

[global.attributes.institution]
severity = "M"

[global.attributes.institution_id]
severity = "H"

[global.attributes.initialization_index]
severity = "H"

[global.attributes.license]
severity = "L"

[global.attributes.mip_era]
severity = "H"

[global.attributes.nominal_resolution]
severity = "H"

[global.attributes.parent_activity_id]
severity = "H"

[global.attributes.parent_experiment_id]
severity = "H"

[global.attributes.parent_mip_era]
severity = "H"

[global.attributes.parent_source_id]
severity = "H"

[global.attributes.parent_variant_label]
severity = "H"

[global.attributes.physics_index]
severity = "H"

[global.attributes.product]
severity = "H"

[global.attributes.realization_index]
severity = "H"

[global.attributes.realm]
severity = "H"

[global.attributes.references]
severity = "L"

[global.attributes.source]
severity = "L"

[global.attributes.source_id]
severity = "H"

[global.attributes.source_type]
severity = "M"

[global.attributes.sub_experiment]
severity = "M"

[global.attributes.sub_experiment_id]
severity = "M"

[global.attributes.table_id]
severity = "H"

[global.attributes.tracking_id]
severity = "H"

[global.attributes.variable_id]
severity = "H"

[global.attributes.variant_label]
severity = "H"

[global.attributes.title]
severity = "L"

[global.attributes.external_variables]
severity = "H"

[global.attributes.description]
severity = "M"
value_type = "str"
is_required = false
pattern = ".*"

[global.attributes.parent_time_units]
severity = "H"
value_type = "str"
is_required = false
na_value = "no parent"
pattern = '^days since [0-9]{4}-[0-9]{1,2}-[0-9]{1,2}( [0-9]{2}:[0-9]{2}:[0-9]{2})?( \((gregorian|standard|proleptic_gregorian|julian|noleap|365_day|all_leap|366_day|360_day|utc|tai)\))?$'

[global.attributes.contact]
severity = "M"
value_type = "str"
is_required = false
pattern = ".*@.*"

[global.attributes.c3s_disclaimer]
severity = "M"
value_type = "str"
is_required = false
pattern = ".*"

[global.attributes.comment]
severity = "L"
value_type = "str"
is_required = false
pattern = ".*"
