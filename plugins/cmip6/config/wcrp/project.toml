# ==============================================================================
# CMIP6 Configuration FILE 
# ==============================================================================
# Documentation & check inventory at https://esgf.github.io/cc-plugin-wcrp/checks/
project_name = "cmip6"
project_version = "1.0"

# ==============================================================================
# == Data Reference Syntax checks
# ==============================================================================

[drs.filename]
# Check FILE001
severity = "H"

[drs.directory]
# Check PATH003
severity = "H"

[drs.attributes_vs_directory]
# Check PATH001
severity = "H"

[drs.filename_vs_directory]
# Check PATH002 
severity = "H"

[file.format]
# Check FILE002
severity = "H"
expected_format = "HDF5"
expected_data_model = "NETCDF4_CLASSIC"

[file.compression]
# Check FILE003
severity = "H"
expected_complevel = 1
expected_shuffle = true

