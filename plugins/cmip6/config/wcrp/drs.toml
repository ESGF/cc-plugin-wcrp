# ==============================================================================
# == Data Reference Syntax checks
# ==============================================================================

[drs.filename]
# Check FILE001
severity = "H"

[drs.directory]
# Check PATH003
severity = "H"

[drs.attributes_vs_directory]
# Check PATH001
severity = "H"

[drs.filename_vs_directory]
# Check PATH002 
severity = "H"

[drs.time_range_label_precision]
# Configurable precision used by TIME003 to validate filename timeranges.
yr = "yyyy"
dec = "yyyy"
mon = "yyyyMM"
day = "yyyyMMdd"
"6hr" = "yyyyMMddhhmm"
"3hr" = "yyyyMMddhhmm"
"1hr" = "yyyyMMddhhmm"
subhr = "yyyyMMddhhmmss"