# ==============================================================================
# == Metadata checks applied to all coordinate variables
# ==============================================================================

[coordinates.bounds]
# Checks VAR004
severity = "H"

[coordinates.dimensions]
# Checks VAR002 DIM001 DIM002 DIM003
severity = "H"

# ==============================================================================
# == Metadata checks applied to latitude coordinate
# ==============================================================================

[coordinates.latitude.name]
# Checks VAR001
severity = "H"
variable_name = "lat"

[coordinates.latitude.type]
# Checks VAR001
severity = "H"
data_type = "double"

[coordinates.latitude.monotonicity]
# Checks VAR005
severity = "H"
direction = "increasing"

[coordinates.latitude.attributes.axis]
# Checks ATTR001 ATTR002 ATTR003 ATTR004
severity = "H"
value_type = "str"
is_required = true
constant = "Y"

[coordinates.latitude.attributes.standard_name]
# Checks ATTR001 ATTR002 ATTR003 ATTR004
severity = "H"
value_type = "str"
is_required = true
constant = "latitude"

[coordinates.latitude.attributes.units]
# Checks ATTR001 ATTR002 ATTR003 ATTR004
severity = "H"
value_type = "str"
is_required = true
constant = "degrees_north"

[coordinates.latitude.attributes.bounds]
# Checks ATTR001 ATTR002 ATTR003 ATTR004
severity = "H"
value_type = "str"
is_required = true
as_variable = true

